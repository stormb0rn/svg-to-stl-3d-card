<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloudflare SVG Relief Card</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <section class="panel controls-panel">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5z"/><path d="M7.5 10.5h9M7.5 13.5h9"/></svg>
        </div>
        <div>
          <h1>SVG Relief Card</h1>
          <p>Cloudflare Worker 生成 STL，适合浮雕卡片线稿。</p>
        </div>
      </div>

      <form id="form" class="controls">
        <label class="file-drop">
          <input id="svgFile" type="file" accept=".svg,image/svg+xml" required>
          <span class="file-title">上传 SVG</span>
          <span id="fileName" class="file-name">未选择文件</span>
        </label>

        <div class="control-grid">
          <label>
            <span>长边尺寸 mm</span>
            <input name="longMm" type="number" min="20" max="240" step="1" value="120">
          </label>
          <label>
            <span>栅格长边 px</span>
            <input name="rasterWidth" type="number" min="300" max="900" step="20" value="640">
          </label>
          <label>
            <span>底板厚度 mm</span>
            <input name="baseThickness" type="number" min="0.4" max="6" step="0.1" value="1.5">
          </label>
          <label>
            <span>线条高出底板 mm</span>
            <input name="featureHeight" type="number" min="0.2" max="6" step="0.1" value="2.0">
          </label>
          <label>
            <span>黑线阈值</span>
            <input name="lineThreshold" type="number" min="20" max="250" step="1" value="225">
          </label>
          <label>
            <span>凸起线宽 px</span>
            <input name="grooveWidthPx" type="number" min="0.5" max="8" step="0.5" value="2.2">
          </label>
          <label>
            <span>保留组件数</span>
            <input name="maskKeepComponents" type="number" min="1" max="20" step="1" value="8">
          </label>
          <label>
            <span>底部桥接宽度 px</span>
            <input name="bridgeWidthPx" type="number" min="0" max="100" step="1" value="34">
          </label>
          <label>
            <span>底板外扩 px</span>
            <input name="basePaddingPx" type="number" min="0" max="40" step="1" value="6">
          </label>
        </div>

        <button id="runButton" type="submit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span>生成 STL</span>
        </button>
      </form>
    </section>

    <section class="panel workspace">
      <div class="status-bar">
        <div>
          <div id="statusTitle" class="status-title">等待 SVG</div>
          <div id="statusText" class="status-text">浏览器负责渲染 SVG，Worker 负责生成模型。</div>
        </div>
        <a id="downloadLink" class="download disabled" href="#" download="card.stl">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4"/><path d="M5 20h14"/></svg>
          <span>下载 STL</span>
        </a>
      </div>

      <div class="progress-track"><div id="progressBar"></div></div>

      <div class="preview-grid">
        <figure>
          <figcaption>SVG 渲染预览</figcaption>
          <canvas id="sourceCanvas"></canvas>
        </figure>
        <figure>
          <figcaption>黑线阈值预览</figcaption>
          <canvas id="lineCanvas"></canvas>
        </figure>
      </div>

      <pre id="log" class="log"></pre>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
